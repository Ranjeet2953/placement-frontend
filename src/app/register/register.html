<form class="register-form" (ngSubmit)="register()">
  <div class="input-group">
    <input type="text" [(ngModel)]="username" name="username" placeholder="Username" required autocomplete="username" />
    <span class="icon"><svg width="22" height="22" fill="#fff" viewBox="0 0 20 20"><path d="M10 10a4 4 0 100-8 4 4 0 000 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
  </div>
  <div class="input-group">
    <input type="password" [(ngModel)]="password" name="password" placeholder="Password" required autocomplete="new-password" />
    <span class="icon"><svg width="22" height="22" fill="#fff" viewBox="0 0 20 20"><path d="M17 8V7a5 5 0 00-10 0v1a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2zm-8-1a3 3 0 016 0v1H9V7zm8 9a1 1 0 01-1 1H5a1 1 0 01-1-1v-6a1 1 0 011-1h10a1 1 0 011 1v6z"/></svg></span>
  </div>
  <div class="input-group">
    <select [(ngModel)]="role" name="role" aria-label="Select user role">
      <option value="STUDENT">Student</option>
      <option value="ADMIN">Admin</option>
    </select>
  </div>
  <button class="main-btn" type="submit">Register</button>
  <div class="error-msg" *ngIf="error">{{ error }}</div>
  <div class="success-msg" *ngIf="success">{{ success }}</div>
</form>
