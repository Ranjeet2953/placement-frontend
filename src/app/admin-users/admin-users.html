<h2>Manage Users</h2>
<mat-table [dataSource]="users" class="mat-elevation-z8">
  
  <ng-container matColumnDef="id">
    <mat-header-cell *matHeaderCellDef> ID </mat-header-cell>
    <mat-cell *matCellDef="let user"> {{ user.id }} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="username">
    <mat-header-cell *matHeaderCellDef> Username </mat-header-cell>
    <mat-cell *matCellDef="let user"> {{ user.username }} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="roles">
    <mat-header-cell *matHeaderCellDef> Roles </mat-header-cell>
    <mat-cell *matCellDef="let user"> {{ user.rolesText }} </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="['id', 'username', 'roles']"></mat-header-row>
  <mat-row *matRowDef="let row; columns: ['id', 'username', 'roles'];"></mat-row>
</mat-table>
