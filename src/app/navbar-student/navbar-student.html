<nav class="sidebar-nav">
  <div class="sidebar-header">
    <div class="logo-circle">TP</div>
    <div class="app-titles">
      <div class="portal-title">T&amp;P Portal</div>
      <div class="subtitle">Student Dashboard</div>
    </div>
  </div>

  <ul>
    <li class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <a routerLink="/dashboard"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>

    <li class="nav-item" routerLinkActive="active">
      <a routerLink="/student-drives"><i class="fas fa-briefcase"></i><span>Placements</span></a>
    </li>
    <li class="nav-item" routerLinkActive="active">
      <a routerLink="/interviews"><i class="fas fa-calendar"></i><span>Interviews</span></a>
    </li>
    <li class="nav-item" routerLinkActive="active">
      <a routerLink="/applications"><i class="fas fa-paper-plane"></i><span>Applications</span></a>
    </li>
    <li class="nav-item" routerLinkActive="active">
      <a routerLink="/student-profile"><i class="fas fa-user"></i><span>Profile</span></a>
    </li>
    <li class="nav-item" routerLinkActive="active">
      <a routerLink="/settings"><i class="fas fa-cog"></i><span>Settings</span></a>
    </li>
  </ul>

  <!-- Footer with profile + logout -->
  <div class="sidebar-footer">
    <div class="student-circle">
    <img [src]="studentImageUrl || 'default-profile.png'" alt="Student Profile">

      <a (click)="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
