<form class="login-form" (ngSubmit)="login()">
  <div class="form-group">
    <input [(ngModel)]="username" name="username" placeholder="Username" required autocomplete="username" />
  </div>
  <div class="form-group">
    <input [(ngModel)]="password" name="password" type="password" placeholder="Password" required autocomplete="current-password" />
  </div>
  <button type="submit">Login</button>
  <div *ngIf="error" class="error-msg">{{ error }}</div>
</form>
