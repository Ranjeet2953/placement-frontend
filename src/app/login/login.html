<form class="login-form" (ngSubmit)="login()">
  <h2 class="form-title">Welcome Back</h2>
  
  <div class="input-group">
    <input type="text" [(ngModel)]="username" name="username" required placeholder="Username" />
    <span class="icon">
      <svg width="20" height="20" fill="#6b6b6b" viewBox="0 0 20 20">
        <path d="M10 10a4 4 0 100-8 4 4 0 000 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </span>
  </div>

  <div class="input-group">
    <input type="password" [(ngModel)]="password" name="password" required placeholder="Password" />
    <span class="icon">
      <svg width="20" height="20" fill="#6b6b6b" viewBox="0 0 20 20">
        <path d="M17 8V7a5 5 0 00-10 0v1a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2zm-8-1a3 3 0 016 0v1H9V7z"/>
      </svg>
    </span>
  </div>

  <div class="row-between">
    <label class="remember"><input type="checkbox" /> Remember me</label>
    <a href="#" class="forgot">Forgot password?</a>
  </div>

  <button class="main-btn" type="submit">Login</button>
  <div class="error-msg" *ngIf="error">{{ error }}</div>
</form>
