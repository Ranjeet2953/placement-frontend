<div class="back-button-container">
  <button mat-stroked-button color="primary" class="back-btn" (click)="goBack()">
    <mat-icon>arrow_back</mat-icon>
    Back
  </button>
</div>

<h2>Manage Applications</h2>

<mat-table [dataSource]="applicationList" class="mat-elevation-z8 stylish-table" aria-label="Applications Table">

  <!-- Company Column -->
  <ng-container matColumnDef="company">
    <mat-header-cell *matHeaderCellDef> Company </mat-header-cell>
    <mat-cell *matCellDef="let app">
      <a href="#" class="company-link" (click)="onCompanyClick(app.drive.id, $event)">
        {{ app['drive']?.['companyName'] }}
      </a>
    </mat-cell>
  </ng-container>

  <!-- Date Column -->
  <ng-container matColumnDef="date">
    <mat-header-cell *matHeaderCellDef> Date </mat-header-cell>
    <mat-cell *matCellDef="let app">
      {{ app['drive']?.['dateOfDrive'] | date:'mediumDate' }}
    </mat-cell>
  </ng-container>

  <!-- Status Column -->
  <ng-container matColumnDef="status">
    <mat-header-cell *matHeaderCellDef> Status </mat-header-cell>
    <mat-cell *matCellDef="let app">
      <a *ngIf="app.status === 'APPLIED'" href="#" (click)="onStatusClick(app.drive.id, $event)" class="status-applied">
        {{ app.status }}
      </a>
      <span *ngIf="app.status !== 'APPLIED'" class="status-other">{{ app.status }}</span>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></mat-row>

</mat-table>

<div *ngIf="applicationList.length === 0" class="empty-state">No applications found.</div>
