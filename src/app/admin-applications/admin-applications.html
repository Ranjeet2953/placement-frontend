<h2>Manage Applications</h2>

<mat-table [dataSource]="applicationList" class="mat-elevation-z8">

  <!-- Company Column -->
  <ng-container matColumnDef="company">
    <mat-header-cell *matHeaderCellDef> Company </mat-header-cell>
    <mat-cell *matCellDef="let app"> {{ app.drive?.companyName }} </mat-cell>
  </ng-container>

  <!-- Date Column -->
  <ng-container matColumnDef="date">
    <mat-header-cell *matHeaderCellDef> Date </mat-header-cell>
    <mat-cell *matCellDef="let app"> {{ app.drive?.dateOfDrive | date:'mediumDate' }} </mat-cell>
  </ng-container>

  <!-- Status Column -->
  <ng-container matColumnDef="status">
    <mat-header-cell *matHeaderCellDef> Status </mat-header-cell>
    <mat-cell *matCellDef="let app"> {{ app.status }} </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="['company', 'date', 'status']"></mat-header-row>
  <mat-row *matRowDef="let row; columns: ['company', 'date', 'status'];"></mat-row>
</mat-table>

<div *ngIf="applicationList.length === 0" style="margin-top: 1rem;">
  No applications found.
</div>
