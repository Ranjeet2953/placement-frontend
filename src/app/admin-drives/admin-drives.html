<div class="header">
  <button mat-icon-button (click)="goBack()" aria-label="Back to Dashboard">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <h2>Drives List</h2>
</div>

<button mat-raised-button color="primary" (click)="navigateAddDrive()" class="add-drive-btn">
  Add New Drive
</button>

<div *ngIf="drives.length === 0" class="empty-state">
  No drives available.
</div>

<div class="drives-grid">
  <mat-card *ngFor="let drive of drives" class="drive-card mat-elevation-z4" (click)="openDriveDetails(drive)" style="cursor:pointer;">
    <mat-card-header>
      <mat-card-title class="company-name">{{ drive.companyName }}</mat-card-title>
      <mat-card-subtitle>
        <strong>Applications:</strong> {{ drive.applicationCount || 0 }}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p><strong>Date:</strong> {{ drive.dateOfDrive | date:'mediumDate' }}</p>
      <p><strong>Location:</strong> {{ drive.location }}</p>
      <p class="job-desc">{{ drive.jd | slice:0:120 }}{{ drive.jd.length > 120 ? '...' : '' }}</p>
    </mat-card-content>
  </mat-card>
</div>
